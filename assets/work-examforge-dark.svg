<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="301" viewBox="0 0 1000 301" role="img" aria-label="ExamForge. Turns a syllabus PDF into a question paper from a custom marks distribution and difficulty, on Ollama or OpenAI. Uploads are parsed in a sandbox, syllabus text is fenced against prompt injection, and 150 tests run in CI."><title>ExamForge. Turns a syllabus PDF into a question paper from a custom marks distribution and difficulty, on Ollama or OpenAI. Uploads are parsed in a sandbox, syllabus text is fenced against prompt injection, and 150 tests run in CI.</title><defs><style>@font-face{font-family:VPMono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPMono;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPMono;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPSans;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPSans;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPSans;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style></defs><rect x="0.75" y="0.75" width="998.5" height="299.5" rx="16" fill="#12141f" stroke="#262a40" stroke-width="1.5"/><text x="32.0" y="44.0" font-family="VPMono" font-weight="600" font-size="12.5" fill="#8b9cff" letter-spacing="1.4">04</text><text x="62.4" y="44.0" font-family="VPMono" font-weight="600" font-size="12.5" fill="#ffc861" letter-spacing="1.8">LLM TOOLING</text><text x="950.0" y="44.0" font-family="VPMono" font-weight="600" font-size="11.5" fill="#8b8ea3" letter-spacing="1.4" text-anchor="end">REPO</text><path d="M958.0 45.0 L968.0 35.0 M961.0 35.0 H968.0 V42.0" fill="none" stroke="#8b9cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="32.0" y="82.0" font-family="VPSans" font-weight="700" font-size="27" fill="#ecedf5" letter-spacing="-0.4">ExamForge</text><text x="32.0" y="120.0" font-family="VPSans" font-weight="400" font-size="16" fill="#a9acc0">Turns a syllabus PDF into a question paper from a custom marks distribution and difficulty, on Ollama or OpenAI. Uploads are parsed in a</text><text x="32.0" y="145.0" font-family="VPSans" font-weight="400" font-size="16" fill="#a9acc0">sandbox, syllabus text is fenced against prompt injection, and 150 tests run in CI.</text><rect x="32.0" y="177" width="211.5" height="58" rx="10" fill="#181b2b" stroke="#262a40"/><text x="46.0" y="202.0" font-family="VPSans" font-weight="600" font-size="15" fill="#ecedf5">Syllabus</text><text x="46.0" y="221.0" font-family="VPMono" font-weight="400" font-size="11.5" fill="#8b8ea3">PDF upload</text><path d="M249.5 206.0 H267.5 M262.5 202.0 L267.5 206.0 L262.5 210.0" fill="none" stroke="#8b9cff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="273.5" y="177" width="211.5" height="58" rx="10" fill="#181b2b" stroke="#262a40"/><text x="287.5" y="202.0" font-family="VPSans" font-weight="600" font-size="15" fill="#ecedf5">Topics</text><text x="287.5" y="221.0" font-family="VPMono" font-weight="400" font-size="11.5" fill="#8b8ea3">found by the LLM</text><path d="M491.0 206.0 H509.0 M504.0 202.0 L509.0 206.0 L504.0 210.0" fill="none" stroke="#8b9cff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="515.0" y="177" width="211.5" height="58" rx="10" fill="#181b2b" stroke="#262a40"/><text x="529.0" y="202.0" font-family="VPSans" font-weight="600" font-size="15" fill="#ecedf5">Questions</text><text x="529.0" y="221.0" font-family="VPMono" font-weight="400" font-size="11.5" fill="#8b8ea3">marks, difficulty</text><path d="M732.5 206.0 H750.5 M745.5 202.0 L750.5 206.0 L745.5 210.0" fill="none" stroke="#8b9cff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="756.5" y="177" width="211.5" height="58" rx="10" fill="#181b2b" stroke="#262a40"/><text x="770.5" y="202.0" font-family="VPSans"
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="301" viewBox="0 0 1000 301" role="img" aria-label="An in-house vision pipeline for CoTester. Replaced a third-party LLM API with models we run ourselves, served on FastAPI. Icon naming in ONNX and two-pass OCR catch elements the first pass missed, and image-based element detection time is cut by about 85%."><title>An in-house vision pipeline for CoTester. Replaced a third-party LLM API with models we run ourselves, served on FastAPI. Icon naming in ONNX and two-pass OCR catch elements the first pass missed, and image-based element detection time is cut by about 85%.</title><defs><style>@font-face{font-family:VPMono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPMono;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPMono;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPSans;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPSans;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPSans;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style></defs><rect x="0.75" y="0.75" width="998.5" height="299.5" rx="16" fill="#ffffff" stroke="#dfe2ee" stroke-width="1.5"/><text x="32.0" y="44.0" font-family="VPMono" font-weight="600" font-size="12.5" fill="#3f51d6" letter-spacing="1.4">01</text><text x="62.4" y="44.0" font-family="VPMono" font-weight="600" font-size="12.5" fill="#a06400" letter-spacing="1.8">TESTGRID · COTESTER VISION</text><text x="950.0" y="44.0" font-family="VPMono" font-weight="600" font-size="11.5" fill="#6a6d85" letter-spacing="1.4" text-anchor="end">CASE STUDY</text><path d="M958.0 45.0 L968.0 35.0 M961.0 35.0 H968.0 V42.0" fill="none" stroke="#3f51d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="32.0" y="82.0" font-family="VPSans" font-weight="700" font-size="27" fill="#16172a" letter-spacing="-0.4">An in-house vision pipeline for CoTester</text><text x="32.0" y="120.0" font-family="VPSans" font-weight="400" font-size="16" fill="#474a63">Replaced a third-party LLM API with models we run ourselves, served on FastAPI. Icon naming in ONNX and two-pass OCR catch</text><text x="32.0" y="145.0" font-family="VPSans" font-weight="400" font-size="16" fill="#474a63">elements the first pass missed, and image-based element detection time is cut by about 85%.</text><rect x="32.0" y="177" width="211.5" height="58" rx="10" fill="#f3f4fa" stroke="#dfe2ee"/><text x="46.0" y="202.0" font-family="VPSans" font-weight="600" font-size="15" fill="#16172a">Screenshot</text><text x="46.0" y="221.0" font-family="VPMono" font-weight="400" font-size="11.5" fill="#6a6d85">web or mobile</text><path d="M249.5 206.0 H267.5 M262.5 202.0 L267.5 206.0 L262.5 210.0" fill="none" stroke="#3f51d6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="273.5" y="177" width="211.5" height="58" rx="10" fill="#f3f4fa" stroke="#dfe2ee"/><text x="287.5" y="202.0" font-family="VPSans" font-weight="600" font-size="15" fill="#16172a">Detection</text><text x="287.5" y="221.0" font-family="VPMono" font-weight="400" font-size="11.5" fill="#6a6d85">VLM, YOLO</text><path d="M491.0 206.0 H509.0 M504.0 202.0 L509.0 206.0 L504.0 210.0" fill="none" stroke="#3f51d6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="515.0" y="177" width="211.5" height="58" rx="10" fill="#f3f4fa" stroke="#dfe2ee"/><text x="529.0" y="202.0" font-family="VPSans" font-weight="600" font-size="15" fill="#16172a">Text and icons</text><text x="529.0" y="221.0" font-family="VPMono" font-weight="400" font-size="11.5" fill="#6a6d85">two-pass OCR, ONNX</text><path d="M732.5 206.0 H750.5 M745.5 202.0 L750.5 206.0 L745.5 210.0" fill="none" stroke="#3f51d6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="756.5" y="177" width="211.5" height="58" rx="10" fill="#f3f4fa" stroke="#dfe2ee"/><text x="770.5" y="202.0" font-family="VPSans" font-weight="600" font-size="15" fill="#16172a">Elements</text><text x="770.5" y="221.0" font-family="VPMono" font-weight="400" font-size="11.5" fill="#6a6d85">role, label, position</text><text x="32.0" y="273.0" font-family="VPMono" font-weight="500" font-size="12" fill="#6a6d85" letter-spacing="0.3">Python  ·  VLM  ·  YOLO  ·  ONNX  ·  OCR  ·  FastAPI</text></svg>
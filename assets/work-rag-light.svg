<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="301" viewBox="0 0 1000 301" role="img" aria-label="RAG system with an evaluation pipeline. Hybrid search over Pinecone and BM25, fused with Reciprocal Rank Fusion, that falls back to keywords when the vector store is down. A 45-question golden set scores RAGAS (with a separate judge model), retrieval hit rate, MRR and refusals, and 72 offline tests run in CI."><title>RAG system with an evaluation pipeline. Hybrid search over Pinecone and BM25, fused with Reciprocal Rank Fusion, that falls back to keywords when the vector store is down. A 45-question golden set scores RAGAS (with a separate judge model), retrieval hit rate, MRR and refusals, and 72 offline tests run in CI.</title><defs><style>@font-face{font-family:VPMono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPMono;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPMono;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPSans;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPSans;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:VPSans;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style></defs><rect x="0.75" y="0.75" width="998.5" height="299.5" rx="16" fill="#ffffff" stroke="#dfe2ee" stroke-width="1.5"/><text x="32.0" y="44.0" font-family="VPMono" font-weight="600" font-size="12.5" fill="#3f51d6" letter-spacing="1.4">03</text><text x="62.4" y="44.0" font-family="VPMono" font-weight="600" font-size="12.5" fill="#a06400" letter-spacing="1.8">RETRIEVAL AND EVALUATION</text><text x="950.0" y="44.0" font-family="VPMono" font-weight="600" font-size="11.5" fill="#6a6d85" letter-spacing="1.4" text-anchor="end">REPO</text><path d="M958.0 45.0 L968.0 35.0 M961.0 35.0 H968.0 V42.0" fill="none" stroke="#3f51d6" stroke-width="1.8" stroke-linecap=